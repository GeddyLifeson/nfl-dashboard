<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Dashboard</title>
<style>
:root {
  --bg: #0e1217; --surface: #161b22; --raised: #1d242d; --line: #2a323d;
  --text: #e6edf3; --muted: #9aa7b4; --accent: #f26b1d; --good: #4cc38a; --bad: #f07178;
  --head: Bahnschrift, "Segoe UI Semibold", system-ui, sans-serif;
  --body: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
header h1 { margin: 0; font: 600 22px var(--head); letter-spacing: .5px; }
header .meta { color: var(--muted); }
header .spacer { flex: 1; }
nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
button { font: 600 13px var(--body); color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { background: #26303b; }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { cursor: wait; color: var(--muted); }
main { padding: 16px 24px 48px; max-width: 1400px; }
h2 { font: 600 18px var(--head); margin: 24px 0 8px; }
h2:first-child { margin-top: 8px; }
p.note { color: var(--muted); margin: 4px 0 12px; max-width: 900px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 12px; }
select, input { font: 14px var(--body); color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; background: var(--surface); }
th, td { padding: 6px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--raised); color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; cursor: pointer; user-select: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:hover td { background: #1a2029; }
.good { color: var(--good); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.out td { color: var(--muted); }
tr.best td { font-weight: 600; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 12px; font-weight: 600; background: var(--raised); border: 1px solid var(--line); }
.tag.warn { color: var(--bad); border-color: var(--bad); }
.meter { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: var(--line); vertical-align: middle; margin-left: 8px; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
.card .big { font: 600 28px var(--head); }
.status { color: var(--muted); font-size: 13px; }
.err { color: var(--bad); }
.builder { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.builder .slip { position: sticky; top: 8px; }
.game { margin-bottom: 12px; }
.game h3 { margin: 0 0 8px; font: 600 15px var(--head); }
.lines { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 6px; align-items: center; }
.lines .lbl { color: var(--muted); font-size: 12px; }
.pick { display: flex; justify-content: space-between; gap: 8px; text-align: left; font-weight: 400; }
.pick b { font-variant-numeric: tabular-nums; }
.pick small { color: var(--muted); }
.pick.on small { color: #fff; }
.leg { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.leg button { padding: 0 8px; }
.ticketbar { display: none; }
/* ---- Player cards and team ratings panel ---- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; }
.pc { --tier: #8a94a3; --tc1: #333; --tc2: #555; position: relative; display: flex; flex-direction: column; min-height: 300px; padding: 10px 12px 10px 22px;
  background: linear-gradient(160deg, #1b222c 0%, #10151b 70%); border: 1px solid var(--tier); border-radius: 10px;
  clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.03); overflow: hidden; }
.pc::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: linear-gradient(180deg, var(--tc1), var(--tc2)); }
.pc::after { content: ''; position: absolute; right: -40px; top: 40px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--tier) 22%, transparent), transparent 70%); pointer-events: none; }
.pc.t-elite { --tier: #e8b84a; } .pc.t-pro { --tier: #38c6c0; } .pc.t-starter { --tier: #aab4c0; } .pc.t-reserve { --tier: #b07a4f; }
.pc .top { display: flex; justify-content: space-between; align-items: flex-start; }
.pc .ovr { font: 700 40px/1 var(--head); color: var(--tier); font-variant-numeric: tabular-nums; }
.pc .ovr small { display: block; font: 600 11px var(--body); letter-spacing: 1.5px; color: var(--muted); }
.pc .side { text-align: right; font: 600 12px var(--head); letter-spacing: 1px; color: var(--muted); }
.pc .side b { display: block; font-size: 18px; color: var(--text); }
.pc .mono { align-self: center; display: grid; place-items: center; width: 74px; height: 74px; margin: 6px 0 8px; border-radius: 50%;
  background: linear-gradient(135deg, var(--tc1), var(--tc2)); border: 2px solid var(--tier); font: 700 26px var(--head); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.pc .nm { text-align: center; font: 600 15px/1.2 var(--head); letter-spacing: .3px; padding: 4px 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.pc .nm small { display: block; font: 600 10px var(--body); letter-spacing: 1.5px; color: var(--tier); text-transform: uppercase; margin-top: 2px; }
.pc .attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; }
.pc .at { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--muted); letter-spacing: .5px; }
.pc .at b { font: 700 15px var(--head); font-variant-numeric: tabular-nums; }
.pc .foot { margin-top: auto; padding-top: 8px; font-size: 11px; color: var(--muted); text-align: center; }
.r-hi { color: #4cc38a; } .r-mid { color: #e6edf3; } .r-lo { color: #e3a44c; } .r-bad { color: #f07178; }
.pc.mini { min-height: 0; padding: 8px 10px 8px 18px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
.pc.mini::before { width: 8px; } .pc.mini .ovr { font-size: 28px; } .pc.mini .mono { display: none; } .pc.mini .nm { font-size: 13px; text-align: left; padding: 2px 0 4px; margin-bottom: 4px; }
.pc.mini .attrs { grid-template-columns: 1fr 1fr; gap: 2px 10px; } .pc.mini .foot { display: none; } .pc.mini .at b { font-size: 13px; }
.cards.minis { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; margin: 8px 0 16px; }
.tile { --tc1: #333; display: flex; flex-direction: column; align-items: center; padding: 6px 4px; border-radius: 6px; border: 1px solid var(--line); border-top: 4px solid var(--tc1); background: var(--surface); font: 600 13px var(--head); }
.tile span { font-size: 18px; } .tile small { font: 600 10px var(--body); color: var(--muted); }
.tile.on { background: var(--raised); border-color: var(--accent); border-top-color: var(--tc1); }
.tp { --tc1: #333; --tc2: #555; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.tp .hdr { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; padding: 16px 20px; background: linear-gradient(110deg, var(--tc1) 0%, var(--tc2) 55%, #10151b 100%); }
.tp .hdr .mono { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 12px; background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.5); font: 700 22px var(--head); }
.tp .hdr h3 { margin: 0; font: 700 26px/1.1 var(--head); letter-spacing: .5px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.tp .hdr .sub { font-size: 13px; opacity: .9; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.tp .plates { display: flex; gap: 10px; margin-left: auto; }
.plate { min-width: 74px; text-align: center; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); }
.plate b { display: block; font: 700 32px/1 var(--head); font-variant-numeric: tabular-nums; } .plate small { font: 600 10px var(--body); letter-spacing: 1.5px; opacity: .85; }
.tp .body { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px 32px; padding: 16px 20px 18px; }
.tp h4 { margin: 0 0 6px; font: 600 12px var(--body); letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
.ab { display: grid; grid-template-columns: 120px 1fr 34px; align-items: center; gap: 10px; padding: 4px 0; font-size: 13px; }
.ab .track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.ab .track i { display: block; height: 100%; border-radius: 4px; }
.ab b { text-align: right; font: 700 15px var(--head); font-variant-numeric: tabular-nums; }
details.more { margin-top: 16px; } details.more summary { cursor: pointer; color: var(--muted); font-weight: 600; }
@media (max-width: 640px) { .cards { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; } .tp .plates { margin-left: 0; } .ab { grid-template-columns: 100px 1fr 30px; } }
@media (max-width: 900px) {
  .builder { grid-template-columns: 1fr; } .builder .slip { position: static; }
  .ticketbar { display: flex; justify-content: space-between; gap: 12px; position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px;
    background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; z-index: 5; }
  main.has-bar { padding-bottom: 72px; }
}
@media (max-width: 640px) { header, nav, main { padding-left: 12px; padding-right: 12px; } .grid { grid-template-columns: 1fr; } .lines { grid-template-columns: 70px 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>NFL Dashboard</h1>
  <span class="meta" id="meta">Loading...</span>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <button id="refresh">Refresh data</button>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<script>
const TABS = [['rankings', 'Rankings'], ['teams', 'Teams'], ['games', 'Games'], ['players', 'Player cards'], ['projections', 'Player projections'], ['parlay', 'Parlay builder'], ['model', 'Model accuracy']];
const POS_ORDER = ['QB', 'RB', 'WR', 'TE', 'EDGE', 'DL', 'LB', 'CB', 'S', 'K'];
const LABEL = {
  cmp: 'Cmp/Att', pass_yds: 'Pass yds', td: 'TD', int: 'INT', epa_play: 'EPA/play', cpoe: 'CPOE', rush_yds: 'Rush yds', car: 'Carries',
  ypc: 'Yds/carry', rec: 'Rec', rec_yds: 'Rec yds', tgt: 'Targets', yds: 'Yards', yds_g: 'Yds/game', epa_tgt: 'EPA/target',
  sacks: 'Sacks', qb_hits: 'QB hits', tfl: 'TFL', ff: 'FF', tackles: 'Tackles', pd: 'PD', fg: 'FG', fg_pct: 'FG%', long: 'Long',
  fifty_plus: '50+', pat: 'PAT', passing_yards: 'Pass yds', passing_tds: 'Pass TD', passing_interceptions: 'INT',
  rushing_yards: 'Rush yds', rushing_tds: 'Rush TD', receptions: 'Rec', receiving_yards: 'Rec yds', receiving_tds: 'Rec TD'
};
let D = null, tab = localStorage.getItem('tab') || 'rankings';
const state = { rankBy: 'pos', team: null, pos: 'QB', projPos: 'All', projTeam: 'All', projSearch: '' };

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) n.append(k instanceof Node ? k : String(k));
  return n;
}
const fmt = (v, d = 1) => (v === null || v === undefined || v === '') ? '' : (typeof v === 'number' ? v.toFixed(d) : v);
const signed = (v, d = 1) => (v > 0 ? '+' : '') + Number(v).toFixed(d);
const pct = v => Math.round(v * 100) + '%';
function rankCell(r, total = 32) {
  const cls = r <= total / 4 ? 'good' : r > total * 3 / 4 ? 'bad' : '';
  return el('td', { class: 'num ' + cls }, r);
}

// Sortable table: cols = [{key, label, num, render(row) -> td|text, sort(row) -> value}]
function table(cols, rows, initial) {
  let sortKey = initial ? initial.key : null, asc = initial ? initial.asc : true;
  const box = el('div', { class: 'wrap' });
  function draw() {
    const col = cols.find(c => c.key === sortKey);
    const data = col ? [...rows].sort((a, b) => {
      const x = col.sort ? col.sort(a) : a[col.key], y = col.sort ? col.sort(b) : b[col.key];
      return (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1);
    }) : rows;
    const head = el('tr', {}, cols.map(c => el('th', {
      class: c.num ? 'num' : '', title: 'Sort', onclick: () => { asc = sortKey === c.key ? !asc : !!c.ascFirst; sortKey = c.key; draw(); }
    }, c.label + (c.key === sortKey ? (asc ? ' ▲' : ' ▼') : ''))));
    const body = data.map(r => el('tr', { class: r._cls || '' }, cols.map(c => {
      const v = c.render ? c.render(r) : r[c.key];
      return v instanceof Node && v.tagName === 'TD' ? v : el('td', { class: c.num ? 'num' : '' }, v);
    })));
    box.replaceChildren(el('table', {}, el('thead', {}, head), el('tbody', {}, body)));
  }
  draw();
  return box;
}

function rankings() {
  const by = state.rankBy;
  const bar = el('div', { class: 'bar' }, [['pos', 'Overall'], ['off_rank', 'Offense'], ['def_rank', 'Defense']].map(([k, l]) =>
    el('button', { class: by === k ? 'on' : '', onclick: () => { state.rankBy = k; render(); } }, l)));
  const t = table([
    { key: 'pos', label: 'Power', num: true, ascFirst: true },
    { key: 'team', label: 'Team', ascFirst: true },
    { key: 'record', label: 'Record', ascFirst: true },
    { key: 'rating', label: 'SAM rating', num: true, render: r => signed(r.rating) },
    { key: 'score_rating', label: 'Scores only', num: true, render: r => r.score_rating === undefined ? '' : signed(r.score_rating) },
    { key: 'move', label: 'Move', num: true, render: r => el('td', { class: 'num ' + (r.move > 0 ? 'good' : r.move < 0 ? 'bad' : 'muted') }, r.move > 0 ? '▲' + r.move : r.move < 0 ? '▼' + (-r.move) : '=') },
    { key: 'off_rank', label: 'Offense', num: true, ascFirst: true, render: r => rankCell(r.off_rank) },
    { key: 'off_epa', label: 'Off EPA/play', num: true, render: r => signed(r.off_epa, 3) },
    { key: 'def_rank', label: 'Defense', num: true, ascFirst: true, render: r => rankCell(r.def_rank) },
    { key: 'def_epa', label: 'Def EPA allowed', num: true, ascFirst: true, render: r => signed(r.def_epa, 3) },
    { key: 'margin', label: 'Avg margin', num: true, render: r => signed(r.margin) },
    { key: 'sos_rank', label: 'Schedule rank', num: true, ascFirst: true },
  ], D.power, { key: by, asc: true });
  return [el('h2', {}, 'Power rankings'),
    el('p', { class: 'note' }, 'SAM rating = points per game better than an average team on a neutral field, from SAM\'s multi-factor model: this season\'s scores plus opponent-adjusted efficiency per play (EPA and success rate, passing and rushing), special teams, turnover margin and coaching changes, with last season as a starting point. "Scores only" is the old rating from final scores alone. Offense and defense rank by EPA per play (expected points added), adjusted for opponents, garbage time left out. Click any column to sort.'),
    bar, t];
}

// ---- Card ratings. Every number below is derived from data.json; nothing is hand-entered.
// Overall (OVR) = blend of the position rating (0-100) and the player's rank in his position group, scaled to 45-99.
// Attributes = percentile of one stat within the position group, scaled to 40-99.
const TEAM_COLORS = {
  ARI: ['#97233F', '#3a0d18'], ATL: ['#A71930', '#1d1d1d'], BAL: ['#241773', '#9E7C0C'], BUF: ['#00338D', '#C60C30'], CAR: ['#0085CA', '#101820'],
  CHI: ['#C83803', '#0B162A'], CIN: ['#FB4F14', '#101820'], CLE: ['#FF3C00', '#311D00'], DAL: ['#003594', '#869397'], DEN: ['#FB4F14', '#002244'],
  DET: ['#0076B6', '#B0B7BC'], GB: ['#203731', '#FFB612'], HOU: ['#A71930', '#03202F'], IND: ['#002C5F', '#A2AAAD'], JAX: ['#006778', '#D7A22A'],
  KC: ['#E31837', '#FFB81C'], LAC: ['#0080C6', '#FFC20E'], LAR: ['#003594', '#FFA300'], LV: ['#A5ACAF', '#101010'], MIA: ['#008E97', '#FC4C02'],
  MIN: ['#4F2683', '#FFC62F'], NE: ['#002244', '#C60C30'], NO: ['#D3BC8D', '#101820'], NYG: ['#0B2265', '#A71930'], NYJ: ['#125740', '#0d2b21'],
  PHI: ['#004C54', '#A5ACAD'], PIT: ['#FFB612', '#101820'], SEA: ['#002244', '#69BE28'], SF: ['#AA0000', '#B3995D'], TB: ['#D50A0A', '#34302B'],
  TEN: ['#4B92DB', '#0C2340'], WAS: ['#5A1414', '#FFB612']
};
const teamVars = abbr => { const c = TEAM_COLORS[abbr] || ['#333', '#555']; return '--tc1:' + c[0] + ';--tc2:' + c[1]; };
const per = (v, g) => g ? v / g : 0;
const frac = s => { const [a, b] = String(s || '0/0').split('/').map(Number); return b ? a / b : 0; };
// [label, title, value(row), higherIsBetter]
const ATTRS = {
  QB: [['EFF', 'EPA per play', r => r.epa_play], ['ACC', 'Completion % over expected', r => r.cpoe], ['YDS', 'Passing yards per game', r => per(r.pass_yds, r.games)],
    ['TD', 'Passing TDs per game', r => per(r.td, r.games)], ['SAFE', 'Interceptions per attempt (fewer is better)', r => { const a = +String(r.cmp).split('/')[1] || 1; return -(r.int / a); }],
    ['RUN', 'Rushing yards per game', r => per(r.rush_yds, r.games)]],
  RB: [['RUSH', 'Rushing yards per game', r => per(r.rush_yds, r.games)], ['YPC', 'Yards per carry', r => r.ypc], ['WORK', 'Carries per game', r => per(r.car, r.games)],
    ['REC', 'Receiving yards per game', r => per(r.rec_yds, r.games)], ['CATCH', 'Receptions per game', r => per(r.rec, r.games)], ['TD', 'Touchdowns per game', r => per(r.td, r.games)]],
  WR: [['YDS', 'Receiving yards per game', r => r.yds_g], ['EFF', 'EPA per target', r => r.epa_tgt], ['HNDS', 'Catch rate (receptions per target)', r => per(r.rec, r.tgt)],
    ['TGT', 'Targets per game', r => per(r.tgt, r.games)], ['REC', 'Receptions per game', r => per(r.rec, r.games)], ['TD', 'Touchdowns per game', r => per(r.td, r.games)]],
  EDGE: [['SACK', 'Sacks per game', r => per(r.sacks, r.games)], ['PRES', 'QB hits per game', r => per(r.qb_hits, r.games)], ['TFL', 'Tackles for loss per game', r => per(r.tfl, r.games)],
    ['TKL', 'Tackles per game', r => per(r.tackles, r.games)], ['STRP', 'Forced fumbles per game', r => per(r.ff, r.games)], ['DISR', 'Sacks + QB hits + TFL per game', r => per(r.sacks + r.qb_hits + r.tfl, r.games)]],
  LB: [['TKL', 'Tackles per game', r => per(r.tackles, r.games)], ['TFL', 'Tackles for loss per game', r => per(r.tfl, r.games)], ['RUSH', 'Sacks per game', r => per(r.sacks, r.games)],
    ['COV', 'Passes defended per game', r => per(r.pd, r.games)], ['BALL', 'Interceptions per game', r => per(r.int, r.games)], ['PLAY', 'Tackles + TFL + sacks + PD per game', r => per(r.tackles + r.tfl + r.sacks + r.pd, r.games)]],
  CB: [['COV', 'Passes defended per game', r => per(r.pd, r.games)], ['BALL', 'Interceptions per game', r => per(r.int, r.games)], ['TKL', 'Tackles per game', r => per(r.tackles, r.games)],
    ['PLAY', 'Interceptions x3 + passes defended per game', r => per(3 * r.int + r.pd, r.games)], ['TD', 'Defensive touchdowns', r => r.td], ['DUR', 'Games played', r => r.games]],
  K: [['ACC', 'Field-goal %', r => r.fg_pct], ['VOL', 'Field goals made per game', r => per(+String(r.fg).split('/')[0], r.games)], ['LONG', '50+ yard makes', r => r.fifty_plus],
    ['XP', 'Extra-point %', r => frac(r.pat)], ['ATT', 'Field-goal attempts per game', r => per(+String(r.fg).split('/')[1], r.games)], ['DUR', 'Games played', r => r.games]]
};
ATTRS.TE = ATTRS.WR; ATTRS.DL = ATTRS.EDGE; ATTRS.S = ATTRS.CB;
const TIERS = [[90, 'elite', 'Elite'], [80, 'pro', 'Pro'], [70, 'starter', 'Starter'], [0, 'reserve', 'Reserve']];
const tierOf = ovr => TIERS.find(t => ovr >= t[0]);
const rateCls = v => v >= 85 ? 'r-hi' : v >= 70 ? 'r-mid' : v >= 55 ? 'r-lo' : 'r-bad';
const initials = n => n.replace(/\b(Jr|Sr|II|III|IV)\.?$/i, '').trim().split(/\s+/).map(w => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();

let CARDS = null;   // pos -> [{...row, pos, ovr, attrs: [[label, title, value]]}]
function buildCards() {
  CARDS = {};
  for (const [pos, rows] of Object.entries(D.players || {})) {
    const defs = ATTRS[pos] || [], n = rows.length;
    // percentile with ties averaged: share of the group this value beats
    const scaled = defs.map(([, , f]) => {
      const vals = rows.map(r => { const v = f(r); return Number.isFinite(v) ? v : 0; });
      return vals.map(v => {
        const below = vals.filter(x => x < v).length, same = vals.filter(x => x === v).length;
        return n > 1 ? Math.round(40 + 59 * (below + (same - 1) / 2) / (n - 1)) : 99;
      });
    });
    CARDS[pos] = rows.map((r, i) => {
      const pct = n > 1 ? 1 - (r.rank - 1) / (n - 1) : 1;
      const ovr = Math.round(45 + 54 * (0.5 * r.rating / 100 + 0.5 * pct));
      return { ...r, pos, ovr, attrs: defs.map(([l, t], j) => [l, t, scaled[j][i]]) };
    });
  }
}

// Team ratings: each stat's league rank (1 = best, already flipped for "fewer is better" stats) scaled to 99 (1st) down to 60 (32nd).
const rankRating = r => Math.round(99 - (r - 1) * 39 / 31);
const TEAM_ATTRS = {
  Offense: [['Passing', ['pass_yds']], ['Rushing', ['rush_yds', 'ypc']], ['Efficiency', ['epa', 'success', 'ypp']], ['Scoring', ['pts', 'redzone']],
    ['Third down', ['third']], ['Big plays', ['explosive']], ['Protection', ['sacked']], ['Ball security', ['giveaways']]],
  Defense: [['Pass defense', ['pass_yds_a']], ['Run defense', ['rush_yds_a']], ['Efficiency', ['epa_a', 'success_a', 'ypp_a']], ['Scoring defense', ['pts_a', 'redzone_a']],
    ['Third down', ['third_a']], ['Big plays allowed', ['explosive_a']], ['Pass rush', ['sacks']], ['Takeaways', ['takeaways']]],
  Overall: [['Turnover margin', ['to_margin']], ['Discipline', ['pen_yds']], ['Schedule faced', null]]
};
function teamRatings(t) {
  const stats = Object.fromEntries((D.team_stats[t.abbr] || []).map(s => [s.key, s]));
  const groups = {};
  for (const [g, list] of Object.entries(TEAM_ATTRS)) groups[g] = list.map(([label, keys]) => {
    if (!keys) return { label, v: rankRating(t.sos_rank), why: 'Schedule strength rank #' + t.sos_rank };
    const got = keys.map(k => stats[k]).filter(Boolean);
    if (!got.length) return null;
    return { label, v: Math.round(got.reduce((a, s) => a + rankRating(s.rank), 0) / got.length), why: got.map(s => s.label + ' ' + s.value + ' (#' + s.rank + ')').join(' · ') };
  }).filter(Boolean);
  return { ovr: rankRating(t.pos), off: rankRating(t.off_rank), def: rankRating(t.def_rank), groups };
}
const barColor = v => v >= 90 ? '#4cc38a' : v >= 80 ? '#38c6c0' : v >= 70 ? '#aab4c0' : v >= 65 ? '#e3a44c' : '#f07178';

function gameCard(g) {

      '; ' + bl.holdout.join('-') + ' is the untouched holdout. Win-chance error is log loss (lower is better); ATS counts leans of ' + bl.lean + '+ points; ML is betting moneylines with 2%+ blend value at the closing price.'),
    table([{ key: 'k', label: 'Test' }, { key: 'games', label: 'Games', num: true }, { key: 'winners', label: 'Picks winner', num: true, render: r => (r.winners * 100).toFixed(1) + '%' },

    el('h2', {}, 'Player projections'),

// ---- Parlay builder: odds.json holds each US book's price and the sharp (Pinnacle, vig removed) chance per leg;
// correlations.json holds how same-game results move together and how often favorites win by each margin.
let O = null, C = null, slip = [];
const opts = { boost: 0, bonus: false, bank: 0 };
try { slip = JSON.parse(localStorage.getItem('slip') || '[]'); Object.assign(opts, JSON.parse(localStorage.getItem('slipOpts') || '{}')); } catch (e) { slip = []; }
const saveOpts = () => { try { localStorage.setItem('slipOpts', JSON.stringify(opts)); } catch (e) {} };

// Same-game legs: how a leg relates to the game's favorite and the over, for the correlation table.
function legRole(l) {
  const g = l.game, favHome = g.favHome;
  if (l.market === 'total') return { kind: 'over', sign: l.side === 'Over' ? 1 : -1 };
  const isFav = (l.side === g.home) === favHome;
  return { kind: l.market === 'ML' ? 'win' : 'cover', sign: isFav ? 1 : -1 };
}
function pairPhi(a, b) {
  if (!C) return 0;
  const ra = legRole(a), rb = legRole(b), k = [ra.kind, rb.kind].sort().join('-');
  const base = { 'over-win': C.phi.fav_win_over, 'cover-over': C.phi.fav_cover_over, 'cover-win': C.phi.fav_win_cover }[k];
  return base === undefined ? 0 : base * ra.sign * rb.sign;
}
function pairJoint(a, b) {
  // P(both) for two legs of one game: team legs by correlation, a player TD prop with a team leg by
  // the historical odds ratio for his position; other prop pairs as independent
  const td = [a, b].find(l => l.market === 'prop' && l.tds), other = td && (td === a ? b : a);
  if (td && other.market !== 'prop' && C && C.td && C.td[td.pos]) {
    const t = C.td[td.pos], pB = other.fair;
    let or = other.market === 'total' ? t['over' + td.tds] : t['win' + td.tds];
    if (other.market === 'total' ? other.side === 'Under' : other.side !== td.team) or = 1 / or;
    const o = pB / (1 - pB) * or;
    return td.fair * o / (1 + o);
  }
  if (a.market === 'prop' || b.market === 'prop') return a.fair * b.fair;
  const joint = a.fair * b.fair + pairPhi(a, b) * Math.sqrt(a.fair * (1 - a.fair) * b.fair * (1 - b.fair));
  return Math.max(Math.min(joint, a.fair, b.fair), 0);
}
function ticketChance(legs) {
  // independent across games; within a game, pairwise adjustments from history
  let p = legs.reduce((x, l) => x * l.fair, 1);
  for (let i = 0; i < legs.length; i++) for (let j = i + 1; j < legs.length; j++) {
    const a = legs[i], b = legs[j];
    if (a.game.id === b.game.id) p *= pairJoint(a, b) / (a.fair * b.fair);
  }
  return p;
}

// ---- Player props, loaded per game on demand with the viewer's own Odds API key (kept in this browser only).
const PROP_MARKETS = { player_anytime_td: 'Anytime TD', player_tds_over: '2+ TDs', player_pass_yds: 'Pass yds', player_rush_yds: 'Rush yds',
  player_reception_yds: 'Rec yds', player_receptions: 'Receptions' };
const PROP_BOOKS = { pinnacle: 'Pinnacle', draftkings: 'DraftKings', fanduel: 'FanDuel', betmgm: 'BetMGM', williamhill_us: 'Caesars',
  espnbet: 'ESPN BET', betrivers: 'BetRivers', fanatics: 'Fanatics', hardrockbet: 'Hard Rock', novig: 'Novig' };   // 10 books bill as one region
const propState = {};                                 // game id -> {status, legs, market}
const oddsKey = () => { try { return localStorage.getItem('oddsKey') || ''; } catch (e) { return ''; } };

function playerInfo(name) {
  const norm = s => s.toLowerCase().replace(/[^a-z ]/g, '').replace(/\b(jr|sr|ii|iii|iv)\b/g, '').trim();
  const p = (D && D.projections || []).find(x => norm(x.name) === norm(name));
  const full = p && (D.power || []).find(t => t.abbr === p.team || (p.team === 'LA' && t.abbr === 'LAR'));
  return p ? { pos: p.pos, team: full ? full.team : null } : { pos: null, team: null };
}

function devig(sides) {
  // {side: {book: dec}} for two sides -> ({side: chance}, source)
  const names = Object.keys(sides);
  if (names.length !== 2) return [null, null];
  if (names.every(s => sides[s].Pinnacle)) {
    const inv = names.map(s => 1 / sides[s].Pinnacle), z = inv[0] + inv[1];
    return [{ [names[0]]: inv[0] / z, [names[1]]: inv[1] / z }, 'pinnacle'];
  }
  const both = Object.keys(sides[names[0]]).filter(b => b in sides[names[1]]);
  if (!both.length) return [null, null];
  const v = both.map(b => { const x = 1 / sides[names[0]][b], y = 1 / sides[names[1]][b]; return x / (x + y); }).sort((a, b) => a - b);
  const med = v[Math.floor(v.length / 2)];
  return [{ [names[0]]: med, [names[1]]: 1 - med }, 'consensus'];
}

async function loadProps(g) {
  const key = oddsKey();
  if (!key) return;
  propState[g.id] = { status: 'Loading props...' }; render();
  const url = 'https://api.the-odds-api.com/v4/sports/americanfootball_nfl/events/' + g.id + '/odds?apiKey=' + encodeURIComponent(key) +
    '&bookmakers=' + Object.keys(PROP_BOOKS).join(',') + '&markets=' + Object.keys(PROP_MARKETS).join(',') + '&oddsFormat=decimal';
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || 'HTTP ' + r.status);
    const left = r.headers.get('x-requests-remaining');
    const ev = await r.json();
    const groups = {};                                // market|player|point -> {side: {book: dec}}
    for (const bk of ev.bookmakers || []) for (const m of bk.markets) for (const o of m.outcomes) {
      const k = m.key + '|' + o.description + '|' + (o.point ?? '');
      ((groups[k] = groups[k] || {})[o.name] = groups[k][o.name] || {})[PROP_BOOKS[bk.key]] = o.price;
    }
    const legs = [];
    const add = (mk, player, side, line, label, fair, src, books, tds) => {
      const us = Object.fromEntries(Object.entries(books).filter(([b]) => b !== 'Pinnacle'));
      if (!Object.keys(us).length || !fair) return;
      const info = playerInfo(player);
      legs.push({ key: g.id + '|prop|' + label, market: 'prop', prop: mk, player, side, line, label, fair, src, books: us, tds, pos: info.pos, team: info.team, game: g });
    };
    const anytime = {};
    for (const [k, sides] of Object.entries(groups)) {
      const [mk, player, pt] = k.split('|');
      const [f, src] = devig(sides);
      if (mk === 'player_anytime_td') {
        if (f && f.Yes) anytime[player] = [f.Yes, src];
        add(mk, player, 'Yes', null, player + ' anytime TD', f && f.Yes, src, sides.Yes || {}, 1);
      } else if (mk !== 'player_tds_over' && f) {
        for (const side of Object.keys(sides)) add(mk, player, side, +pt, player + ' ' + side + ' ' + pt + ' ' + PROP_MARKETS[mk].toLowerCase(), f[side], src, sides[side]);
      }
    }
    for (const [k, sides] of Object.entries(groups)) {   // 2+ TDs: Pinnacle rarely posts it, so derive it from anytime TD
      const [mk, player, pt] = k.split('|');
      if (mk !== 'player_tds_over' || +pt !== 1.5 || !sides.Over || !anytime[player]) continue;
      const lam = -Math.log(1 - anytime[player][0]);
      add(mk, player, 'Over', 1.5, player + ' 2+ TDs', 1 - Math.exp(-lam) * (1 + lam), anytime[player][1] + ', derived', sides.Over, 2);
    }
    g.legs = g.legs.filter(l => l.market !== 'prop').concat(legs);
    propState[g.id] = { status: legs.length + ' props loaded' + (left ? ' · ' + left + ' credits left' : ''), market: 'player_anytime_td' };
  } catch (e) {
    propState[g.id] = { status: 'Props failed: ' + e.message };
  }
  render();
}

function propsView(g) {
  const st = propState[g.id];
  if (!oddsKey()) {
    const inp = el('input', { type: 'password', placeholder: 'Odds API key', style: 'width:180px' });
    return el('div', { class: 'bar' }, el('small', { class: 'muted' }, 'Player props need your Odds API key (saved only in this browser, about 6 credits a game):'), inp,
      el('button', { onclick: () => { try { localStorage.setItem('oddsKey', inp.value.trim()); } catch (e) {} render(); } }, 'Save key'));
  }
  if (!st || !g.legs.some(l => l.market === 'prop'))

  const sel = el('select', { onchange: e => { st.market = e.target.value; render(); } },
    Object.entries(PROP_MARKETS).map(([k, v]) => { const o = el('option', { value: k }, v); if (k === st.market) o.selected = true; return o; }));

// what a ticket returns per 1 staked when it wins, after a profit boost; a bonus bet keeps only the profit
const ticketReturn = pay => opts.bonus ? (pay - 1) * (1 + opts.boost / 100) : 1 + (pay - 1) * (1 + opts.boost / 100);
const ticketEdge = (hit, pay) => opts.bonus ? hit * ticketReturn(pay) - 0 : hit * ticketReturn(pay) - 1;
// quarter Kelly stake for a cash bet with this edge
const kelly = (hit, pay) => { const b = ticketReturn(pay) - 1, f = (hit * b - (1 - hit)) / b; return Math.max(f / 4, 0); };

function middles() {
  // the same game's spread at two books far enough apart that both bets can win
  if (!C) return [];
  const out = [];
  for (const g of O.games) {
    const sp = g.legs.filter(l => l.market === 'spread');
    const favSide = g.favHome ? g.home : g.away;
    for (const f of sp.filter(l => l.side === favSide && l.line < 0)) for (const d of sp.filter(l => l.side !== favSide && l.line > 0)) {
      const a = -f.line, b = d.line;                      // favorite wins its bet above a, underdog's below b
      if (b - a < 0.5) continue;
      const [fb, fd] = bestPrice(f), [db, dd] = bestPrice(d);
      if (fb === db) continue;
      const tbl = C.margins[String(Math.min(Math.round((a + b) / 2 * 2) / 2, 14))] || {};
      let ev = 0, pMid = 0;
      for (const [m, p] of Object.entries(tbl)) {
        const k = +m, favR = k > a ? fd - 1 : k === a ? 0 : -1, dogR = k < b ? dd - 1 : k === b ? 0 : -1;
        ev += p * (favR + dogR); if (favR > 0 && dogR > 0) pMid += p;
      }
      if (pMid > 0) out.push({ game: g.away + ' at ' + g.home, fav: f.label + ' ' + american(fd) + ' ' + fb, dog: d.label + ' ' + american(dd) + ' ' + db, pMid, ev: ev / 2 });
    }
  }
  return out.sort((x, y) => y.ev - x.ev);
}
const american = d => d >= 2 ? '+' + Math.round((d - 1) * 100) : String(Math.round(-100 / (d - 1)));
const bestPrice = l => Object.entries(l.books).sort((a, b) => b[1] - a[1])[0];

function mainLines(g, market) {
  // the line the most books post, as its two sides
  const groups = {};
  for (const l of g.legs.filter(l => l.market === market)) {
    const k = market === 'spread' ? Math.abs(l.line) : market === 'total' ? l.line : 'ml';
    (groups[k] = groups[k] || []).push(l);
  }
  const best = Object.values(groups).filter(s => s.length === 2)
    .sort((a, b) => Object.keys(b[0].books).length + Object.keys(b[1].books).length - Object.keys(a[0].books).length - Object.keys(a[1].books).length)[0];
  if (!best) return null;
  if (market === 'total') return best.sort((a, b) => a.side === 'Over' ? -1 : 1);
  return best.sort((a, b) => a.side === g.away ? -1 : 1);
}

function toggleLeg(g, l, sameMarket) {
  const has = slip.includes(l.key);
  slip = slip.filter(k => !sameMarket.includes(k));          // one side of a market per game
  if (!has) slip.push(l.key);
  try { localStorage.setItem('slip', JSON.stringify(slip)); } catch (e) {}
  render();
}

function parlay() {
  if (!O) {
    const get = f => fetch(f + '?' + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null);
    Promise.all([get('odds.json'), get('correlations.json')]).then(([d, c]) => {
      O = d || { games: [] }; C = c;
      O.games.forEach(g => {                     // the favorite is the side with the higher sharp moneyline chance
        const ml = g.legs.filter(l => l.market === 'ML');
        const h = ml.find(l => l.side === g.home);
        g.favHome = h ? h.fair >= 0.5 : true;
      });
      render();
    });
    return [el('p', { class: 'muted' }, 'Loading odds...')];
  }
  if (!O.games.length) return [el('h2', {}, 'Parlay builder'), el('p', { class: 'note' }, 'No odds yet. They appear once the odds feed has run (it needs the ODDS_API_KEY secret on GitHub).')];
  const byKey = {};
  O.games.forEach(g => g.legs.forEach(l => { byKey[l.key] = { ...l, game: g }; }));
  slip = slip.filter(k => byKey[k]);
  const legs = slip.map(k => byKey[k]);
  const hit = ticketChance(legs);
  document.getElementById('view').classList.toggle('has-bar', legs.length > 0);
  const bar = legs.length ? el('a', { class: 'ticketbar', href: '#ticket' }, el('span', {}, legs.length + ' leg' + (legs.length > 1 ? 's' : '')),
    el('span', {}, 'Fair ' + american(1 / hit) + ' · view ticket')) : '';
  const cards = O.games.map(g => {
    const rows = [['Moneyline', 'ML'], ['Spread', 'spread'], ['Total', 'total']].map(([lbl, m]) => {
      const pair = mainLines(g, m);
      if (!pair) return [];
      const keys = g.legs.filter(l => l.market === m).map(l => l.key);
      return [el('span', { class: 'lbl' }, lbl), ...pair.map(l => {
        const [book, dec] = bestPrice(l);
        const name = m === 'total' ? l.label : l.label.replace(g.home, g.home.split(' ').pop()).replace(g.away, g.away.split(' ').pop());
        return el('button', { class: 'pick' + (slip.includes(l.key) ? ' on' : ''), title: 'Fair ' + (l.fair * 100).toFixed(1) + '% (' + l.src + ')',
          onclick: () => toggleLeg(g, l, keys) }, el('span', {}, name, el('br'), el('small', {}, book)), el('b', {}, american(dec)));
      })];
    });
    const when = new Date(g.start).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    return el('div', { class: 'card game' }, el('h3', {}, g.away + ' at ' + g.home, el('span', { class: 'muted' }, ' · ' + when)), el('div', { class: 'lines' }, rows.flat()), propsView(g));
  });
  return [el('h2', {}, 'Parlay builder'),
    el('p', { class: 'note' }, 'Pick legs to see the fair price of the whole ticket and what every book pays for it. Buttons show the best price for that leg across books. ' +
      'Fair chances are Pinnacle\'s line with the vig removed (a median across books where Pinnacle has no matching line). Odds as of ' + new Date(O.updated).toLocaleString() + '.'),
    el('div', { class: 'builder' }, el('div', {}, cards), slipView(legs)), middleView(), bar];
}

async function poll() {
  const res = await fetch('api/status').catch(() => null);
  if (!res || !res.ok) {                      // hosted copy: no server, GitHub refreshes it on a schedule
    document.getElementById('refresh').remove();
    document.getElementById('status').textContent = 'Updates automatically several times a day';
    return;
  }
  const s = await res.json();
  const btn = document.getElementById('refresh');
  btn.disabled = s.running;
  btn.textContent = s.running ? 'Refreshing...' : 'Refresh data';
  if (s.running) { setTimeout(poll, 3000); return; }
  if (s.ok === false) document.getElementById('status').replaceChildren(el('span', { class: 'err' }, 'Refresh failed: ' + s.message));
  else if (s.finished) { document.getElementById('status').textContent = ''; load(); }
}
document.getElementById('refresh').addEventListener('click', async () => { await fetch('api/refresh', { method: 'POST' }); poll(); });
load().then(poll);
</script>
</body>
</html>
